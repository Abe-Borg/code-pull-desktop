appId: com.codepull.desktop
productName: Code Pull
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - "**/node_modules/keytar/**"
  - "**/node_modules/playwright/**"
  - "**/node_modules/playwright-core/**"
extraResources:
  - from: build/playwright-browsers
    to: playwright-browsers
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Code-Pull-Setup.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
